[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prg_toolbox"
version = "0.1.0"
description = "Toolbox for Phenomenological Renormalization Group Analysis of brain data"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "scikit-learn>=1.0",
    "pooch"
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov"]
dev = ["pre-commit", "ruff==0.16.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["prg_toolbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E203",  # whitespace before ':' -- black/ruff format style disagrees with pycodestyle here by design
    "E501",  # line too long -- the formatter can't wrap long string literals/docstrings; not worth blocking commits over
    "E721",  # do not compare types with `!=` -- CGVariables/observable classes deliberately use strict `type() != X`
             # (rejecting subclasses) rather than isinstance(); changing that is a semantic decision, not a style fix
]

[tool.ruff.lint.per-file-ignores]
"prg_toolbox/__init__.py" = ["F401", "F403", "F405"]
"prg_toolbox/analysis_tools.py" = ["F403", "F405"]
"prg_toolbox/pipelines.py" = ["F403", "F405"]
"prg_toolbox/plotting/*.py" = ["F403", "F405"]

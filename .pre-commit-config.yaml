repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: '\.ipynb$'  # keep example notebooks exactly as saved (outputs included)
      - id: trailing-whitespace
        exclude: '\.ipynb$'
      - id: check-added-large-files
      - id: mixed-line-ending
      - id: fix-byte-order-marker
      - id: check-merge-conflict

  # Formats and lints Python code. Replaces black + isort + flake8 with a
  # single, much faster tool; --fix auto-applies safe fixes (unused imports,
  # import sorting, etc.), leaving the rest for the config in pyproject.toml
  # ([tool.ruff]) to decide what's even flagged in the first place.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: ["--fix"]
        exclude: '\.ipynb$'  # don't touch example notebook code cells
      - id: ruff-format
        exclude: '\.ipynb$'
